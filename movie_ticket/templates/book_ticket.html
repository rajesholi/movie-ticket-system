{% extends 'base.html' %}

{% block content %}

<h2>
Book Ticket:
{{ movie.title }}
</h2>

<p>
Available Seats:
{{ movie.available_seats }}
</p>

{% if error %}
<p style="color:red;">
{{ error }}
</p>
{% endif %}

<form method="POST">

{% csrf_token %}

{{ form.as_p }}

<button type="submit">
Confirm Booking
</button>

</form>

{% endblock %}
