<h2>{{ movie.title }}</h2>

<style>
.seat-container {
    display: grid;
    grid-template-columns: repeat(5, 60px);
    gap: 10px;
    margin-top: 20px;
}

.seat {
    padding: 10px;
    border: 1px solid #333;
    text-align: center;
    cursor: pointer;
    user-select: none;
    border-radius: 6px;
    transition: 0.2s;
}

.seat:hover {
    background: #f0f0f0;
}

.booked {
    background: red;
    color: white;
    cursor: not-allowed;
    border: none;
}

.seat input {
    margin-right: 5px;
}
</style>

<form method="POST">
    {% csrf_token %}

    <div class="seat-container">
        {% for seat in seats %}
            <label class="seat {% if seat.is_booked %}booked{% endif %}">

                {% if not seat.is_booked %}
                    <input type="checkbox" name="seats" value="{{ seat.id }}">
                {% endif %}

                {{ seat.number }}

            </label>
        {% endfor %}
    </div>

    <button type="submit" style="margin-top: 20px;">
        Book Now
    </button>
</form>
